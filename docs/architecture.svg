<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"
     role="img" aria-labelledby="arch-title arch-desc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="arch-title">How one sentence becomes a proven payment on Celo</title>
  <desc id="arch-desc">A freelancer's sentence is parsed by a typed judgment that fails closed. The agent buys sanctions and FX checks over x402 before it will settle anything. The payer opens a pay page and sends a plain ERC-20 transfer on Celo. The watcher proves that transfer from the chain, and the invoice settles.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8ba1"/>
    </marker>
    <marker id="ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#0b1210"/>

  <text x="40" y="44" fill="#5eead4" font-size="11.5" font-weight="700" letter-spacing="1.7">CELO INVOICE AGENT · ERC-8004 #10005</text>
  <text x="40" y="74" fill="#e6edf3" font-size="21" font-weight="600">One sentence in. A proven payment out.</text>

  <!-- connectors are drawn before the boxes so the strokes sit behind them -->
  <path d="M220 152 H250" stroke="#7c8ba1" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M430 152 H460" stroke="#7c8ba1" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M640 152 H670" stroke="#7c8ba1" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M760 189 V263 H520 V300" stroke="#5eead4" stroke-width="1.8" fill="none" marker-end="url(#ar-accent)"/>
  <path d="M640 337 H670" stroke="#5eead4" stroke-width="1.8" fill="none" marker-end="url(#ar-accent)"/>
  <path d="M340 300 V194" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5,4" fill="none" marker-end="url(#ar)"/>

  <!-- row 1 -->
  <g>
    <rect x="40" y="115" width="180" height="74" rx="6" fill="#111a17" stroke="#1f2d28"/>
    <text x="56" y="142" fill="#e6edf3" font-size="15" font-weight="600">One sentence</text>
    <text x="56" y="162" fill="#94a3b8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">“charge Marco 500 BRL”</text>
    <text x="56" y="178" fill="#8496ab" font-size="10.5">Telegram · /wallet · /check</text>
  </g>
  <g>
    <rect x="250" y="115" width="180" height="74" rx="6" fill="#111a17" stroke="#5eead4" stroke-width="1.4"/>
    <text x="266" y="142" fill="#e6edf3" font-size="15" font-weight="600">Typed judgment</text>
    <text x="266" y="162" fill="#94a3b8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amount · currency · payer</text>
    <text x="266" y="178" fill="#5eead4" font-size="10.5">off-schema ⇒ review</text>
  </g>
  <g>
    <rect x="460" y="115" width="180" height="74" rx="6" fill="#111a17" stroke="#1f2d28"/>
    <text x="476" y="142" fill="#e6edf3" font-size="15" font-weight="600">Pay page</text>
    <text x="476" y="162" fill="#94a3b8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/i/INV-0007-2782D9</text>
    <text x="476" y="178" fill="#8496ab" font-size="10.5">deep link · EIP-681 · ramp</text>
  </g>
  <g>
    <rect x="670" y="115" width="180" height="74" rx="6" fill="#111a17" stroke="#1f2d28"/>
    <text x="686" y="142" fill="#e6edf3" font-size="15" font-weight="600">Payer sends it</text>
    <text x="686" y="162" fill="#94a3b8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ERC-20 transfer</text>
    <text x="686" y="178" fill="#8496ab" font-size="10.5">USDC · USA₮ · wBRL on Celo</text>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="250" y="300" width="180" height="74" rx="6" fill="#0f1614" stroke="#94a3b8" stroke-dasharray="4,3"/>
    <text x="266" y="327" fill="#e6edf3" font-size="15" font-weight="600">x402 buy leg</text>
    <text x="266" y="347" fill="#94a3b8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sanctions ×2 + FX</text>
    <text x="266" y="363" fill="#8496ab" font-size="10.5">≈ $0.009, paid per invoice</text>
  </g>
  <g>
    <rect x="460" y="300" width="180" height="74" rx="6" fill="#111a17" stroke="#1f2d28"/>
    <text x="476" y="327" fill="#e6edf3" font-size="15" font-weight="600">verify.py</text>
    <text x="476" y="347" fill="#94a3b8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">initiator ≠ payee</text>
    <text x="476" y="363" fill="#8496ab" font-size="10.5">amount ±5% · right token</text>
  </g>
  <g>
    <rect x="670" y="300" width="180" height="74" rx="6" fill="#111a17" stroke="#5eead4" stroke-width="1.4"/>
    <text x="686" y="327" fill="#e6edf3" font-size="15" font-weight="600">Settled — proven</text>
    <text x="686" y="347" fill="#94a3b8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/proof</text>
    <text x="686" y="363" fill="#6ee7b7" font-size="10.5">re-derived from Celo</text>
  </g>

  <!-- masked arrow labels, sitting beside their segment -->
  <rect x="478" y="231" width="118" height="17" rx="2" fill="#0b1210"/>
  <text x="537" y="243" fill="#5eead4" font-size="10.5" font-weight="600" letter-spacing="0.9" text-anchor="middle">PAYMENT FOUND</text>

  <rect x="352" y="240" width="132" height="17" rx="2" fill="#0b1210"/>
  <text x="358" y="252" fill="#8496ab" font-size="10.5" font-weight="600" letter-spacing="0.9">A HIT BLOCKS IT</text>

  <!-- legend, bottom strip -->
  <g transform="translate(40,430)">
    <rect x="0" y="-9" width="15" height="10" rx="2" fill="#111a17" stroke="#5eead4" stroke-width="1.4"/>
    <text x="22" y="0" fill="#8496ab" font-size="10.5">focal</text>
    <rect x="76" y="-9" width="15" height="10" rx="2" fill="#111a17" stroke="#1f2d28"/>
    <text x="98" y="0" fill="#8496ab" font-size="10.5">process</text>
    <rect x="168" y="-9" width="15" height="10" rx="2" fill="#0f1614" stroke="#94a3b8" stroke-dasharray="4,3"/>
    <text x="190" y="0" fill="#8496ab" font-size="10.5">buys a control it does not own</text>
    <text x="420" y="0" fill="#64748b" font-size="10.5">Every transaction we sign carries an ERC-8021 Schema-0 tag.</text>
  </g>
</svg>
